name: Build AGOU APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ─── 1. Checkout AGOU ────────────────────────────────────────────────
      - name: Checkout AGOU
        uses: actions/checkout@v4

      # ─── 2. Clone Telegram Open Source ───────────────────────────────────
      - name: Clone Telegram Source
        run: |
          git clone --depth=1 https://github.com/DrKLO/Telegram.git TelegramSource
          echo "✓ Telegram cloned"

      # ─── 3. Java 17 ──────────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ─── 4. NDK ──────────────────────────────────────────────────────────
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      # ─── 5. Apply AGOU Patch ─────────────────────────────────────────────
      - name: Apply AGOU Patch
        env:
          APP_ID:   ${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          python3 AGOU/agou_patch.py \
            --tg-dir TelegramSource \
            --api-id   "$APP_ID" \
            --api-hash "$APP_HASH"

      # ─── 6. google-services.json ─────────────────────────────────────────
      - name: Setup Firebase
        run: |
          cp AGOU/TMessagesProj/google-services.json \
             TelegramSource/TMessagesProj/google-services.json
          echo "✓ google-services.json copied"

      # ─── 7. Grant gradlew ────────────────────────────────────────────────
      - name: Grant Gradle permissions
        run: chmod +x TelegramSource/gradlew

      # ─── 8. Build Release APK (unsigned) ─────────────────────────────────
      - name: Build Release APK
        working-directory: TelegramSource
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g"

      # ─── 9. Collect & Upload APK ─────────────────────────────────────────
      - name: Collect APK
        run: |
          mkdir -p output
          find TelegramSource -name "*.apk" -path "*/release/*" | while read f; do
            cp "$f" "output/AGOU-unsigned.apk"
            echo "✓ APK → output/AGOU-unsigned.apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGOU-unsigned
          path: output/AGOU-unsigned.apk
          retention-days: 30

      # ─── 10. GitHub Release (على push لـ main) ───────────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "AGOU v${{ github.run_number }} (unsigned)"
          body: |
            ## AGOU Messenger
            ⚠️ هذا APK غير موقّع — وقّعه باستخدام MT Manager
            
            Developer: @A_KOJO / AKRO
            Based on Telegram Open Source
          files: output/AGOU-unsigned.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

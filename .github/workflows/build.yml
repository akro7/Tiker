name: Build AGOU APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout AGOU
        uses: actions/checkout@v4

      - name: Clone Telegram Source
        run: |
          git clone --depth=1 https://github.com/DrKLO/Telegram.git TelegramSource
          echo "✓ Telegram cloned"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Apply AGOU Patch
        env:
          APP_ID:   ${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          python3 AGOU/agou_patch.py \
            --tg-dir TelegramSource \
            --api-id   "$APP_ID" \
            --api-hash "$APP_HASH"

      - name: Setup Firebase
        run: |
          # نسخ google-services.json وتعديل package_name لـ org.telegram.messenger
          python3 - << 'PYEOF'
          import json, shutil

          src = "AGOU/TMessagesProj/google-services.json"
          dst = "TelegramSource/TMessagesProj/google-services.json"

          shutil.copy(src, dst)

          with open(dst) as f:
              data = json.load(f)

          for client in data.get("client", []):
              info = client.get("client_info", {}).get("android_client_info", {})
              if info.get("package_name") == "agou.eko.telegram":
                  info["package_name"] = "org.telegram.messenger"
                  print("✓ package_name fixed → org.telegram.messenger")

          with open(dst, "w") as f:
              json.dump(data, f, indent=2)

          print("✓ google-services.json ready")
          PYEOF

      - name: Grant Gradle permissions
        run: chmod +x TelegramSource/gradlew

      - name: Build Release APK
        working-directory: TelegramSource
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g"

      - name: Collect APK
        run: |
          mkdir -p output
          find TelegramSource -name "*.apk" -path "*/release/*" | while read f; do
            cp "$f" "output/AGOU-unsigned.apk"
            echo "✓ APK → output/AGOU-unsigned.apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGOU-unsigned
          path: output/AGOU-unsigned.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "AGOU v${{ github.run_number }} (unsigned)"
          body: |
            ## AGOU Messenger
            ⚠️ وقّعه من MT Manager
            Developer: @A_KOJO / AKRO
          files: output/AGOU-unsigned.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
